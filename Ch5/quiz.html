<head>

<title>מבדק פרק 5</title>
<style>
  :root {

      --line: #343a46;
      --paper: #1c2029;
      --bg: #12151b;
      --accent: #6aa8e0;
      --accent-soft: #1d2b3a;

      --ok-soft: #1c2e1f;

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 17px;
    line-height: 1.6;
  }
  .page { max-width: 780px; margin: 0 auto; padding: 24px 16px 80px; }
  header {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 22px;
    margin-bottom: 18px;
  }
  header h1 { margin: 0 0 6px; font-size: 26px; }
  header p { margin: 4px 0; color: var(--muted); }
  .name-row { margin-top: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .name-row input {
    font: inherit;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--paper);
    color: var(--ink);
    min-width: 0;
    flex: 1 1 200px;
  }
  .progress {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg);
    padding: 8px 0 10px;
  }
  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .progress small { color: var(--muted); }
  .q {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }
  .q .head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .q .qnum { font-weight: 700; color: var(--accent); }
  .q .topic { font-size: 13px; color: var(--muted); }
  .q .text { margin: 6px 0 10px; font-weight: 600; }
  code, pre {
    font-family: Consolas, "Cascadia Mono", "Courier New", monospace;
    direction: ltr;
    unicode-bidi: isolate;
  }
  code {
    background: var(--code-bg);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0 5px;
    font-size: 15px;
  }
  pre.code {
    text-align: left;
    background: var(--code-bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 14px;
    margin: 0 0 12px;
    font-size: 15px;
    overflow-x: auto;
  }
  .opts { display: grid; gap: 8px; }
  .opt {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
    background: var(--paper);
  }
  .opt:hover { border-color: var(--accent); }
  .opt input { margin: 0; flex: none; width: 18px; height: 18px; accent-color: var(--accent); }
  .opt pre { margin: 0; text-align: left; white-space: pre; font-size: 15px; }
  .opt.correct { background: var(--ok-soft); border-color: var(--ok); }
  .opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
  .explain {
    display: none;
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    background: var(--accent-soft);
    font-size: 15px;
  }
  .done .explain { display: block; }
  .done .opt { cursor: default; }
  .verdict { font-weight: 700; margin-left: 6px; }
  .verdict.ok { color: var(--ok); }
  .verdict.bad { color: var(--bad); }
  button {
    font: inherit;
    font-weight: 700;
    padding: 12px 22px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 18px 0; }
  .msg { color: var(--warn); font-weight: 600; margin: 8px 0; }
  #result {
    display: none;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 22px;
    margin-bottom: 18px;
  }
  .score { font-size: 54px; font-weight: 800; line-height: 1.1; }
  .score.high { color: var(--ok); }
  .score.mid { color: var(--warn); }
  .score.low { color: var(--bad); }
  .review {
    margin-top: 14px;
    padding: 12px 16px;
    background: var(--warn-soft);
    border-right: 4px solid var(--warn);
    border-radius: 8px;
  }
  .review ul { margin: 6px 0; padding-right: 20px; }
  .review li { margin: 6px 0; }
  .review .ex { color: var(--muted); font-size: 15px; }
  .allgood {
    margin-top: 14px;
    padding: 12px 16px;
    background: var(--ok-soft);
    border-right: 4px solid var(--ok);
    border-radius: 8px;
  }
  a { color: var(--accent); }
  @media (max-width: 520px) {
    body { font-size: 16px; }
    .q { padding: 14px; }
    header { padding: 16px; }
    .score { font-size: 44px; }
  }
</style>

      "$*\n**\n***",
      "$***\n***\n***",
      "$***\n**\n*",
      "$******"
    ],
    "a": 0,
    "exp": "התנאי של הלולאה הפנימית תלוי ב-i. בשורה 1 כוכבית אחת, בשורה 2 שתיים, ובשורה 3 שלוש."
  },
  {
    "t": "nested",
    "text": "מה יודפס?",
    "code": "for (int i = 1; i <= 3; i++)\n{\n    for (int j = 1; j <= 3; j++)\n    {\n        Console.Write(i * j + \" \");\n    }\n    Console.WriteLine();\n}",
    "opts": [
      "$1 2 3\n1 2 3\n1 2 3",
      "$1 2 3\n2 4 6\n3 6 9",
      "$1 4 9",
      "$2 3 4\n3 4 5\n4 5 6"
    ],
    "a": 1,
    "exp": "בכל שורה i קבוע ו-j עובר מ-1 עד 3. מודפסת מכפלה שלהם, וזה לוח הכפל עד 3."
  }
];

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function optHtml(o) {
  if (o.charAt(0) === "$") return "<pre>" + esc(o.slice(1)) + "</pre>";
  return "<span>" + esc(o) + "</span>";
}

function render() {
  var html = "";
  QUESTIONS.forEach(function (q, i) {
    html += '<div class="q" id="q' + i + '">';
    html += '<div class="head"><span class="qnum">שאלה ' + (i + 1) + '</span>';
    html += '<span class="topic">' + esc(TOPICS[q.t].name) + '</span></div>';
    html += '<div class="text">' + esc(q.text) + '</div>';
    if (q.code) html += '<pre class="code">' + esc(q.code) + '</pre>';
    html += '<div class="opts">';
    q.opts.forEach(function (o, j) {
      html += '<label class="opt" id="q' + i + 'o' + j + '"><input type="radio" name="q' + i + '" value="' + j + '">' + optHtml(o) + '</label>';
    });
    html += '</div>';
    html += '<div class="explain" id="e' + i + '"></div>';
    html += '</div>';
  });
  document.getElementById("quiz").innerHTML = html;
  document.querySelectorAll('#quiz input[type=radio]').forEach(function (r) {
    r.addEventListener("change", updateProgress);
  });
  updateProgress();
}

function answers() {
  return QUESTIONS.map(function (q, i) {
    var c = document.querySelector('input[name="q' + i + '"]:checked');
    return c ? parseInt(c.value, 10) : -1;
  });
}

function updateProgress() {
  var n = answers().filter(function (a) { return a >= 0; }).length;
  document.getElementById("barFill").style.width = (n / QUESTIONS.length * 100) + "%";
  document.getElementById("progressText").textContent = "ענית על " + n + " מתוך " + QUESTIONS.length + " שאלות";
}

var submittedOnce = false;

function grade() {
  var ans = answers();
  var missing = ans.filter(function (a) { return a < 0; }).length;
  var msg = document.getElementById("msg");
  if (missing > 0 && !submittedOnce) {
    msg.textContent = (missing === 1 ? "נשארה שאלה אחת בלי תשובה." : "נשארו " + missing + " שאלות בלי תשובה.") + " אפשר לחזור ולענות, או ללחוץ שוב כדי לבדוק בכל זאת.";
    submittedOnce = true;
    var first = ans.indexOf(-1);
    document.getElementById("q" + first).scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  msg.textContent = "";

  var correct = 0;
  var wrongByTopic = {};
  QUESTIONS.forEach(function (q, i) {
    var box = document.getElementById("q" + i);
    box.classList.add("done");
    box.querySelectorAll("input").forEach(function (r) { r.disabled = true; });
    var ok = ans[i] === q.a;
    if (ok) correct++;
    else wrongByTopic[q.t] = (wrongByTopic[q.t] || 0) + 1;
    document.getElementById("q" + i + "o" + q.a).classList.add("correct");
    if (ans[i] >= 0 && !ok) document.getElementById("q" + i + "o" + ans[i]).classList.add("wrong");
    var verdict = ok ? '<span class="verdict ok">נכון.</span>'
                     : (ans[i] < 0 ? '<span class="verdict bad">לא נענתה.</span>' : '<span class="verdict bad">לא נכון.</span>');
    document.getElementById("e" + i).innerHTML = verdict + " " + esc(q.exp);
  });

  var total = QUESTIONS.length;
  var score = Math.round(correct / total * 100);
  var level = score >= 85 ? "high" : (score >= 60 ? "mid" : "low");
  var name = document.getElementById("name").value.trim();

  var r = '<div>' + (name ? esc(name) + ", " : "") + 'הציון שלך:</div>';
  r += '<div class="score ' + level + '">' + score + '</div>';
  r += '<div>ענית נכון על ' + correct + ' מתוך ' + total + ' שאלות.</div>';

  var keys = Object.keys(TOPICS).filter(function (k) { return wrongByTopic[k]; });
  if (keys.length === 0) {
    r += '<div class="allgood"><strong>כל הכבוד!</strong> ענית נכון על כל השאלות. את מוכנה לפרק הבא.</div>';
  } else {
    r += '<div class="review"><strong>נושאים שכדאי לחזור עליהם:</strong><ul>';
    keys.forEach(function (k) {
      var tp = TOPICS[k];
      r += '<li>' + esc(tp.name) + ' <span class="ex">(טעויות: ' + wrongByTopic[k] + '. לחזור על דוגמה ' + tp.ex.join(", ") + ' בקוד ובחוברת)</span></li>';
    });
    r += '</ul>';
    r += '<div>החוברת המלווה: <a href="' + BOOKLET + '" target="_blank" rel="noopener">לפתיחת החוברת</a></div>';
    r += '</div>';
  }
  r += '<p style="margin:14px 0 0;color:var(--muted)">למטה מופיעות כל השאלות עם התשובה הנכונה והסבר.</p>';

  var res = document.getElementById("result");
  res.innerHTML = r;
  res.style.display = "block";

  document.getElementById("actions").innerHTML = '<button id="againBtn" type="button" class="secondary">התחלה מחדש</button>';
  document.getElementById("againBtn").addEventListener("click", restart);
  res.scrollIntoView({ behavior: "smooth", block: "start" });
}

function restart() {
  submittedOnce = false;
  var res = document.getElementById("result");
  res.style.display = "none";
  res.innerHTML = "";
  document.getElementById("actions").innerHTML = '<button id="submitBtn" type="button">בדיקת המבדק</button>';
  document.getElementById("submitBtn").addEventListener("click", grade);
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

document.getElementById("submitBtn").addEventListener("click", grade);
render();
</script>
</body>
</html>
